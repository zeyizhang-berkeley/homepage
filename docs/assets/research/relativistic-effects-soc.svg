<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="rel-title rel-desc">
  <title id="rel-title">Scalar relativity with spin–orbit coupling</title>
  <desc id="rel-desc">Two qualitative aspects of relativistic electronic structure. Left: a smaller teal s-orbital density envelope overlaps a larger dashed gray nonrelativistic reference, illustrating representative scalar-relativistic s-orbital contraction. Right: symbolic orbital angular momentum L and spin S are joined by a spin–orbit coupling connector. Cloud sizes, vector lengths and angles are illustrative, not calculated for a specific complex; the clouds are not electron trajectories and not all orbitals contract.</desc>
